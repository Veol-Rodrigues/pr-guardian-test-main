<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Guardian Web</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; background: #0d1117; color: #c9d1d9; }
        textarea { width: 100%; height: 200px; background: #161b22; color: #fff; padding: 10px; border-radius: 5px; }
        button { background: #238636; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        #result { margin-top: 20px; white-space: pre-wrap; background: #161b22; padding: 15px; border-radius: 5px; border-left: 4px solid #58a6ff; }
    </style>
</head>
<body>
    <h1>🛡️ PR Guardian - Web Dashboard</h1>
    <p>Paste a code snippet below for a Calm Engineering analysis.</p>

    <textarea id="codeInput" placeholder="Paste code here..."></textarea>
    <button onclick="analyzeCode()">Analyze Code</button>

    <div id="result"></div>

    <script>
        async function analyzeCode() {
            const code = document.getElementById('codeInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Analyzing code... please wait ⏳";

            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });
            const data = await response.json();

            if(data.status === 'success') {
                resultDiv.innerHTML = "";
                let i = 0;
                const text = data.analysis;
                function typeWriter() {
                    if (i < text.length) {
                        resultDiv.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(typeWriter, 10);
                    }
                }
                typeWriter();
            } else {
                resultDiv.innerHTML = "Error: " + data.message;
            }
        }
    </script>
</body>
</html>
